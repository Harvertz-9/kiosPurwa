<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kios Purwa</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/public.js"></script>
  <script type="module" src="/src/main.js"></script>

  <!-- Hidden container for Google Translate widget (kept hidden) -->
  <div id="google_translate_element" style="display:none" aria-hidden="true"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      if (window.google && window.google.translate && document.getElementById('google_translate_element')) {
        new google.translate.TranslateElement(
          { pageLanguage: 'id', includedLanguages: 'id,en' },
          'google_translate_element'
        );
      }
    }
    // Load Google Translate script over HTTPS explicitly to avoid protocol-relative issues
    (function loadGTranslate(){
      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      s.async = true;
      s.onerror = function(){ console.warn('Google Translate failed to load') };
      document.head.appendChild(s);
    })();
  </script>
</body>

</html>
